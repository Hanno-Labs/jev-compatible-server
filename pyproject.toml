[project]
name = "jev-compatible-server"
version = "0.1.0"
description = "Open inference runtime for decision models with a Jev-compatible API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.3.0"]
transformers = [
    "accelerate>=1.10.0",
    "gliclass>=0.1.0",
    "gliner2==2.0.0",
    "huggingface-hub>=0.30.0",
    "numpy>=1.26.0",
    "peft>=0.21.0",
    "sentence-transformers>=5.0.0",
    "torch>=2.3.0",
    "transformers>=5.3.0",
]
all = [
    "accelerate>=1.10.0",
    "gliclass>=0.1.0",
    "gliner2==2.0.0",
    "huggingface-hub>=0.30.0",
    "llama-cpp-python>=0.3.0",
    "numpy>=1.26.0",
    "peft>=0.21.0",
    "sentence-transformers>=5.0.0",
    "torch>=2.3.0",
    "transformers>=5.3.0",
]

[project.scripts]
jev-compatible-server = "jev_compatible_server.app:main"

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.cache", "/.tmp", "/.venv", "/dist", "/remote", "/uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_compatible_server"]

[tool.hatch.build.targets.wheel.force-include]
"configs/public-models.json" = "jev_compatible_server/public-models.json"

[tool.uv]
package = true

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
    "huggingface_hub",
    "huggingface_hub.*",
    "gliclass",
    "gliclass.*",
    "numpy",
    "numpy.*",
    "peft",
    "peft.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
follow_imports = "skip"
ignore_missing_imports = true
